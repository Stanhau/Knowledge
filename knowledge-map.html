<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Atlas — Personal Knowledge Map</title>

<!-- Leaflet (map library) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- vis-timeline (timeline library) -->
<link rel="stylesheet" href="https://unpkg.com/vis-timeline@7.7.3/styles/vis-timeline-graph2d.min.css" />
<script src="https://unpkg.com/vis-timeline@7.7.3/standalone/umd/vis-timeline-graph2d.min.js"></script>

<!-- Country boundary data -->
<script src="https://unpkg.com/world-atlas@2.0.2/countries-110m.json" type="application/json" id="placeholder-do-not-use"></script>

<style>
  :root {
    --bg: #f5f1e8;
    --ink: #1a1a1a;
    --paper: #fffdf7;
    --accent: #c1440e;
    --muted: #8a7e6b;
    --line: #d4cdb8;
    --highlight: #e8dcc0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Iowan Old Style', 'Palatino', Georgia, serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
    overflow: hidden;
    height: 100vh;
  }

  header {
    padding: 1rem 2rem;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    background: var(--paper);
  }

  header h1 {
    font-size: 1.4rem;
    font-weight: 400;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  header .sub {
    font-size: 0.8rem;
    color: var(--muted);
    font-style: italic;
  }

  .layout {
    display: grid;
    grid-template-columns: 1fr 380px;
    grid-template-rows: 1fr 240px;
    height: calc(100vh - 60px);
    gap: 1px;
    background: var(--line);
  }

  #map {
    background: var(--paper);
    grid-column: 1;
    grid-row: 1;
  }

  #notes-panel {
    background: var(--paper);
    grid-column: 2;
    grid-row: 1 / 3;
    overflow-y: auto;
    padding: 1.5rem;
  }

  #timeline-container {
    background: var(--paper);
    grid-column: 1;
    grid-row: 2;
    padding: 0.5rem;
    overflow: hidden;
  }

  #notes-panel h2 {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }

  #notes-panel .filter-label {
    font-size: 1.1rem;
    margin-bottom: 1.5rem;
    padding-bottom: 0.75rem;
    border-bottom: 1px solid var(--line);
    font-style: italic;
  }

  #notes-panel .clear {
    font-size: 0.75rem;
    color: var(--accent);
    cursor: pointer;
    text-decoration: underline;
    margin-left: 0.5rem;
  }

  .note {
    padding: 1rem 0;
    border-bottom: 1px dotted var(--line);
  }

  .note:last-child { border-bottom: none; }

  .note .meta {
    font-size: 0.7rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 0.3rem;
  }

  .note .title {
    font-size: 1.05rem;
    margin-bottom: 0.4rem;
  }

  .note .content {
    font-size: 0.9rem;
    color: #333;
  }

  .note .tags {
    margin-top: 0.5rem;
    font-size: 0.7rem;
    color: var(--accent);
  }

  .empty {
    color: var(--muted);
    font-style: italic;
    font-size: 0.9rem;
    padding: 2rem 0;
    text-align: center;
  }

  /* Map styling */
  .leaflet-container {
    background: var(--paper) !important;
    font-family: inherit;
  }

  /* Timeline styling tweaks */
  .vis-timeline {
    border: none !important;
  }

  .vis-item {
    background-color: var(--accent) !important;
    border-color: var(--accent) !important;
    color: white !important;
    font-size: 0.75rem;
  }
</style>
</head>
<body>

<header>
  <h1>Atlas</h1>
  <span class="sub">a personal knowledge map</span>
</header>

<div class="layout">
  <div id="map"></div>
  <div id="notes-panel">
    <h2>Notes</h2>
    <div class="filter-label" id="filter-label">All notes <span class="clear" id="clear-filter" style="display:none">clear</span></div>
    <div id="notes-list"></div>
  </div>
  <div id="timeline-container">
    <div id="timeline"></div>
  </div>
</div>

<script>
// ============================================================
// YOUR NOTES — edit this array to add/change notes.
// Country codes are ISO 3166-1 alpha-2 (e.g. JP=Japan, FR=France, US=USA).
// ============================================================
const NOTES = [
  {
    id: 1,
    title: "The Meiji Restoration",
    country: "JP",
    countryName: "Japan",
    coords: [36.2, 138.2],
    date: "1868-01-03",
    tags: ["history", "politics"],
    content: "Japan's transformation from feudal shogunate to modern industrial state. Reading Marius Jansen's account — striking how rapid the institutional pivot was."
  },
  {
    id: 2,
    title: "Visit to Kyoto, autumn",
    country: "JP",
    countryName: "Japan",
    coords: [35.0, 135.7],
    date: "2023-11-12",
    tags: ["travel", "personal"],
    content: "Tofuku-ji temple at peak momiji season. The valley of maples is staggering — far better in person than any photo."
  },
  {
    id: 3,
    title: "Notes on French structuralism",
    country: "FR",
    countryName: "France",
    coords: [46.5, 2.5],
    date: "1960-06-01",
    tags: ["philosophy", "theory"],
    content: "Lévi-Strauss, Barthes, Foucault — the project of finding underlying systems beneath surface phenomena. Influence on later post-structuralism."
  },
  {
    id: 4,
    title: "Brunelleschi's dome",
    country: "IT",
    countryName: "Italy",
    coords: [43.77, 11.25],
    date: "1436-08-30",
    tags: ["architecture", "history"],
    content: "Completed without a centering scaffold — herringbone brick pattern allowed the dome to support itself during construction. An engineering miracle."
  },
  {
    id: 5,
    title: "Kenya field notes — Maasai Mara",
    country: "KE",
    countryName: "Kenya",
    coords: [-1.5, 35.2],
    date: "2024-07-20",
    tags: ["travel", "nature"],
    content: "Wildebeest migration, the river crossing at Mara. Crocodiles, dust, the sound of thousands of hooves."
  }
];

// ============================================================
// MAP SETUP
// ============================================================
const map = L.map('map', {
  center: [20, 10],
  zoom: 2,
  minZoom: 2,
  worldCopyJump: true,
  zoomControl: true,
  attributionControl: false
});

// Use a minimalist tile layer that fits the aesthetic
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
  attribution: '© OpenStreetMap, © CARTO',
  subdomains: 'abcd',
  maxZoom: 8
}).addTo(map);

// Group notes by country
const notesByCountry = {};
NOTES.forEach(n => {
  if (!notesByCountry[n.country]) notesByCountry[n.country] = [];
  notesByCountry[n.country].push(n);
});

// Add a marker for each country that has notes
Object.entries(notesByCountry).forEach(([code, notes]) => {
  const first = notes[0];
  const marker = L.circleMarker(first.coords, {
    radius: 6 + Math.min(notes.length * 2, 14),
    fillColor: '#c1440e',
    color: '#1a1a1a',
    weight: 1.5,
    opacity: 1,
    fillOpacity: 0.7
  }).addTo(map);

  marker.bindTooltip(`${first.countryName} — ${notes.length} note${notes.length > 1 ? 's' : ''}`, {
    permanent: false,
    direction: 'top',
    className: 'country-tooltip'
  });

  marker.on('click', () => {
    showNotesFor({ type: 'country', code, label: first.countryName });
  });
});

// ============================================================
// TIMELINE SETUP
// ============================================================
const timelineItems = new vis.DataSet(NOTES.map(n => ({
  id: n.id,
  content: n.title,
  start: n.date,
  title: `${n.countryName} — ${n.date}`
})));

const timeline = new vis.Timeline(
  document.getElementById('timeline'),
  timelineItems,
  {
    height: '220px',
    stack: true,
    showCurrentTime: false,
    zoomMin: 1000 * 60 * 60 * 24 * 30, // 1 month minimum zoom
  }
);

timeline.on('click', (props) => {
  if (props.item) {
    const note = NOTES.find(n => n.id === props.item);
    if (note) showNotesFor({ type: 'single', id: note.id, label: note.title });
  }
});

// ============================================================
// NOTES PANEL
// ============================================================
const notesList = document.getElementById('notes-list');
const filterLabel = document.getElementById('filter-label');
const clearBtn = document.getElementById('clear-filter');

function renderNotes(notes) {
  if (notes.length === 0) {
    notesList.innerHTML = '<div class="empty">No notes here yet.</div>';
    return;
  }
  notesList.innerHTML = notes.map(n => `
    <div class="note">
      <div class="meta">${n.countryName} · ${n.date}</div>
      <div class="title">${n.title}</div>
      <div class="content">${n.content}</div>
      <div class="tags">${n.tags.map(t => '#' + t).join(' ')}</div>
    </div>
  `).join('');
}

function showNotesFor(filter) {
  let filtered;
  if (filter.type === 'country') {
    filtered = NOTES.filter(n => n.country === filter.code);
    filterLabel.firstChild.textContent = filter.label + ' ';
  } else if (filter.type === 'single') {
    filtered = NOTES.filter(n => n.id === filter.id);
    filterLabel.firstChild.textContent = filter.label + ' ';
  } else {
    filtered = NOTES;
    filterLabel.firstChild.textContent = 'All notes ';
  }
  renderNotes(filtered);
  clearBtn.style.display = filter.type ? 'inline' : 'none';
}

clearBtn.addEventListener('click', () => showNotesFor({}));

// Initial render: show all notes
showNotesFor({});
</script>

</body>
</html>
